spring.application.name=queueforge
server.port=${PORT:8080}

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3308/queueforge?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:localdev123}

spring.jpa.hibernate.ddl-auto=update

# Locally this builds redis://localhost:6379. On Render set REDIS_URL to the Valkey rediss:// URI (TLS turns on by itself).
spring.data.redis.url=${REDIS_URL:redis://${REDIS_HOST:localhost}:${REDIS_PORT:6379}}

jwt.secret=${JWT_SECRET:local-dev-only-secret-change-me-in-production-0123456789abcdef}
storage.dir=${STORAGE_DIR:uploads}

# Supabase Storage. Leave SUPABASE_URL empty to keep using the local uploads folder.
supabase.url=${SUPABASE_URL:}
supabase.secret-key=${SUPABASE_SECRET_KEY:}
supabase.bucket=${SUPABASE_BUCKET:queueforge}

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=100MB
worker.count=${WORKER_COUNT:3}